      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 500.0
    action_monitor_rate: 20.0
    allow_integration_in_goal_trajectories: false
    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.005  # Reduced from 0.002
      goal_time: 0.0  # 0.0 means infinite time to reach goal (or set specific time like 0.5)
      shoulder_pan_joint: {  goal: 0.002 }    # Tighter tolerances
      shoulder_lift_joint: {  goal: 0.002 }
      elbow_joint: {  goal: 0.002 }
      wrist_1_joint: {  goal: 0.002 }
      wrist_2_joint: {  goal: 0.002 }
