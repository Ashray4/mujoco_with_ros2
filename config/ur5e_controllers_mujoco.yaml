admittance_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    chainable_command_interfaces:
      - position
      - velocity
    kinematics:
      plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
      plugin_package: kinematics_interface
      base: base_link  # Assumed to be stationary
      tip: ee_link  # The end effector frame
      alpha: 0.2
    ft_sensor:
      name: ft_sensor
      frame: 
        id: wrist_3_link-ee_link_fixed_joint  # Wrench measurements are in this frame
      filter_coefficient: 0.1
    control:
      frame:
        id: wrist_3_link  # Admittance calcs (displacement etc) are done in this frame. Usually the tool or end-effector
    fixed_world_frame:
      frame:            # Gravity points down (neg. Z) in this frame (Usually: world or base_link)
        id: base_link
    gravity_compensation:
      frame:
        id: wrist_3_link
      CoG:  # specifies the center of gravity of the end effector
        pos:
          - 0.0  # x
          - 0.0  # y
          - 0.0  # z
        force: 15.  # mass * 9.81
    admittance:
      selected_axes:
        - false  # x
        - false  # y
        - false  # z
        - false  # rx
        - false  # ry
        - false  # rz
      # Having ".0" at the end is MUST, otherwise there is a loading error
      # F = M*a + D*v + S*(x - x_d)
      mass:
        - 8.0  # x
        - 8.0  # y
        - 8.0  # z
        - 8.0  # rx
        - 8.0  # ry
        - 8.0  # rz
      damping_ratio:  # damping can be used instead: zeta = D / (2 * sqrt( M * S ))
        - 30.  # x
        - 30.  # y
        - 30.  # z
        - 30.  # rx
        - 30.  # ry
        - 30.  # rz
      stiffness:
        - 60.  # x
        - 60.  # y
        - 60.  # z
        - 60.  # rx
        - 60.  # ry
        - 60.  # rz
    # general settings
    enable_parameter_update_without_reactivation: true

adaptive_mpc_controller:
  ros__parameters:
    prediction_horizon: 10
    sampling_time: 0.05
    force_sensor_name: motor_fts
    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

cartesian_compliance_controller:
  ros__parameters:
    end_effector_link: "ee_link"
    robot_base_link: "base"
    ft_sensor_ref_link: "ee_link"
    compliance_ref_link: "ee_link"
    
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    
    command_interfaces:
      - position
    
    stiffness:
      trans_x: 1000.0
      trans_y: 1000.0
      trans_z: 1000.0
      rot_x: 500.0
      rot_y: 500.0
      rot_z: 500.0
    
    solver:
      error_scale: 0.05
      iterations: 1
    
    pd_gains:
      trans_x: {p: 52.5, d: 0.1}
      trans_y: {p: 52.5, d: 0.1}
      trans_z: {p: 52.5, d: 0.1}
      rot_x: {p: 0.5, d: 0.05}
      rot_y: {p: 0.5, d: 0.05}
      rot_z: {p: 0.5, d: 0.05}

cartesian_motion_controller:
  ros__parameters:
    end_effector_link: "ee_link"
    robot_base_link: "base"
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    # Choose: position or velocity.
    command_interfaces:
      - position
        #- velocity

    solver:
        error_scale: 1.0
        iterations: 10

    pd_gains:
        trans_x: {p: 1.0}
        trans_y: {p: 1.0}
        trans_z: {p: 1.0}
        rot_x: {p: 0.5}
        rot_y: {p: 0.5}
        rot_z: {p: 0.5}

admittance_controller:
  ros__parameters:
    # Joints to control
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    
    # Command and state interfaces
    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity
    
    # Kinematics
    kinematics:
      plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
      plugin_package: kinematics_interface
      base: base  # Your base link name
      tip: ee_link  # Your end-effector
      group_name: ur_manipulator  # Your planning group
      alpha: 0.0005
    
    # Force-torque sensor
    ft_sensor:
      name: motor_fts
      frame:
        id: ee_link  # Frame where F/T is measured
        external: false  # Sensor is part of robot
      filter_coefficient: 0.005  # Low-pass filter (0.0 = no filter, 1.0 = max filter)
    
    # Control settings
    control:
      frame:
        id: ee_link  # Control frame (same as F/T frame usually)
        external: false
    
    # Fixed world frame
    fixed_world_frame:
      frame:
        id: base  # Your base frame
        external: false
    
    # Gravity compensation
    gravity_compensation:
      frame:
        id: ee_link
        external: false
      CoG:  # Center of Gravity of end-effector + payload
        pos:
          - 0.0
          - 0.0
          - 0.05  # Adjust based on gripper COM
        force: 9.81  # Mass * gravity (adjust for actual gripper mass ~1kg)
    
    # Admittance parameters (mass-spring-damper)
    admittance:
      # Translational admittance
      selected_axes:
        - true   # x
        - true   # y
        - true   # z
        - true   # rx
        - true   # ry
        - true   # rz
      
      # Mass matrix [M] (lower = more responsive to forces)
      mass:
        - 50.0    # x  (kg)
        - 50.0    # y
        - 50.0    # z
        - 10.0    # rx (kg*m^2)
        - 10.0    # ry
        - 10.0    # rz
      
      # Damping matrix [D] (controls settling time)
      damping_ratio:
        - 2.0    # x  (critical damping = 1.0)
        - 2.0    # y
        - 2.0    # z
        - 2.0    # rx
        - 2.0    # ry
        - 2.0    # rz
      
      # Stiffness matrix [K] (restoring force to reference pose)
      stiffness:
        - 200.0  # x  (N/m)
        - 200.0  # y
        - 200.0  # z
        - 10.0   # rx (Nm/rad)
        - 10.0   # ry
        - 10.0   # rz
    
    # Reference/target pose subscriber
    reference:
      frame:
        id: base
        external: false
